name: Build WLED-MM S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout WLED-MM source
        uses: actions/checkout@v4
        with:
          repository: MoonModules/WLED-MM
          ref: mdev
          path: wledmm
          fetch-depth: 0

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: |
          cd wledmm
          pio run -e esp32S3_8MB_PSRAM_M_qspi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32S3_8MB_PSRAM_M_qspi
          path: wledmm/.pio/build/esp32S3_8MB_PSRAM_M_qspi/firmware.bin
