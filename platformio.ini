; PlatformIO Project Configuration File

[platformio]
default_envs = esp32s3_wroom_1_n16nb

[env:esp32s3_wroom_1_n16nb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 16MB flash, PSRAM enabled
board_build.flash_size = 16MB
board_build.psram = enabled

; MoonModules / WLED S3‑friendly flags
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWLED_USE_PSRAM
  -DWLED_WATCHDOG_TIMEOUT=8000

; Optional: faster upload if you flash from PlatformIO locally
upload_speed = 921600
monitor_speed = 115200
