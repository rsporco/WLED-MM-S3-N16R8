[platformio]
default_envs = esp32s3_n16r8_full

; Global settings
upload_speed = 921600
monitor_speed = 115200

; ---------------------------------------------------------
;  FULL WLED‑MM build for ESP32‑S3‑WROOM‑1‑N16R8
; ---------------------------------------------------------
[env:esp32s3_n16r8_full]
platform = espressif32
board = esp32s3-devkitc-1
framework = arduino

; --- Flash configuration ---
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.flash_freq = 80m

; --- PSRAM configuration ---
board_build.psram_type = qspi
board_build.psram_size = 8MB

; --- Build flags ---
build_flags =
    -DWLED_USE_PSRAM
    -DWLED_MM_FULL
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Upload settings ---
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; --- Partition table ---
board_build.partitions = tools/WLED_16MB.csv

